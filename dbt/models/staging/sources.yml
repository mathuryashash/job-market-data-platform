version: 2

sources:
  - name: silver
    description: "Silver-layer Parquet files produced by the Spark transform job"
    meta:
      owner: "@yashashm"
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: silver_date
    tables:
      - name: postings
        description: "Deduplicated, normalized job postings"
        identifier: "postings"
        columns:
          - name: key
            description: "source:company:external_id"
            tests:
              - not_null
          - name: source
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['greenhouse', 'lever', 'ashby']
          - name: title
            tests:
              - not_null
          - name: seniority
            tests:
              - accepted_values:
                  arguments:
                    values: ['intern', 'new_grad', 'junior', 'mid', 'senior', 'manager', 'unknown']
          - name: employment_type
            tests:
              - accepted_values:
                  arguments:
                    values: ['full_time', 'part_time', 'contract', 'internship', 'unknown']
