services:
  # --- Kafka (KRaft, no ZooKeeper) ---
  jmdp-kafka:
    image: apache/kafka:3.9.1
    container_name: jmdp-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@jmdp-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - jmdp-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- MinIO (S3-compatible object store) ---
  jmdp-minio:
    image: minio/minio:latest
    container_name: jmdp-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - jmdp-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MinIO bucket init ---
  jmdp-minio-init:
    image: minio/minio:latest
    container_name: jmdp-minio-init
    depends_on:
      jmdp-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://jmdp-minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/silver &&
        echo 'Buckets ready'
      "
    environment:
      MC_HOST_local: "http://minioadmin:minioadmin@jmdp-minio:9000"

volumes:
  jmdp-kafka-data:
  jmdp-minio-data:

networks:
  default:
    name: jmdp-network
