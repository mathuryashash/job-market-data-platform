name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-timeout pyyaml dbt-core dbt-duckdb duckdb kafka-python boto3

      - name: Lint (ruff)
        run: |
          ruff check src/ tests/ scripts/ dashboard/ airflow/dags/

      - name: Unit tests (no network, no Docker)
        run: |
          pytest tests/test_taxonomy.py tests/test_normalizers.py tests/test_extractors.py -v

  dbt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dbt + duckdb
        run: pip install dbt-core dbt-duckdb duckdb pyyaml

      - name: Copy dbt profiles
        run: cp dbt/profiles.yml.example dbt/profiles.yml

      - name: dbt seed + build + test (DuckDB fixture)
        working-directory: dbt
        run: |
          # CI has no MinIO/silver Parquet, so build on the seed fixture and skip the
          # source tests (they need the real silver table). `dbt build` already runs model tests.
          dbt seed --profiles-dir . --target duckdb
          dbt build --profiles-dir . --target duckdb --vars '{use_fixture: true}' --exclude "source:*"
        env:
          DUCKDB_PATH: job_market.duckdb

  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PySpark
        run: pip install pyspark pytest pyyaml

      - name: Spark transform tests (local mode)
        run: |
          pytest tests/test_spark_transform.py -v

  dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Airflow (constrained)
        run: |
          pip install "apache-airflow==2.9.3" --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"
          pip install pytest

      - name: DAG integrity test
        run: |
          pytest tests/test_dag_integrity.py -v
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////tmp/airflow_ci.db"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
